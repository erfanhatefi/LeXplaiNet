<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">LeXplaiNet</title>
  <desc id="description">A magnifying glass reveals red, blue, and purple relevance paths through a neural network.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#17112B"/>
    </linearGradient>
    <linearGradient id="relevance" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="purple-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <path d="M18 264 C230 175 316 345 526 255 S882 136 1182 232" fill="none" stroke="#8B5CF6" stroke-opacity="0.11" stroke-width="2"/>
  <path d="M18 78 C250 162 374 22 604 96 S962 206 1182 90" fill="none" stroke="#38BDF8" stroke-opacity="0.09" stroke-width="2"/>

  <!-- Magnifying glass -->
  <circle cx="151" cy="145" r="104" fill="#11182C" stroke="#A78BFA" stroke-width="7"/>
  <path d="M225 219 L281 275" fill="none" stroke="#A78BFA" stroke-width="18" stroke-linecap="round"/>
  <path d="M225 219 L281 275" fill="none" stroke="#DDD6FE" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>

  <!-- Quiet network connections -->
  <g fill="none" stroke="#64748B" stroke-opacity="0.42" stroke-width="2">
    <path d="M84 91 L146 72 M84 91 L146 128 M84 145 L146 72 M84 145 L146 128 M84 145 L146 184 M84 199 L146 128 M84 199 L146 184 M146 72 L211 145 M146 128 L211 145 M146 184 L211 145"/>
  </g>

  <!-- Positive, negative, and selected relevance paths -->
  <path d="M84 91 L146 128 L211 145" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 199 L146 184 L211 145" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 145 L146 128 L211 145" fill="none" stroke="url(#relevance)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#purple-glow)"/>

  <!-- Network nodes -->
  <g stroke="#E2E8F0" stroke-width="2">
    <circle cx="84" cy="91" r="9" fill="#3B82F6"/>
    <circle cx="84" cy="145" r="10" fill="#A78BFA"/>
    <circle cx="84" cy="199" r="9" fill="#F43F5E"/>
    <circle cx="146" cy="72" r="8" fill="#334155"/>
    <circle cx="146" cy="128" r="10" fill="#8B5CF6"/>
    <circle cx="146" cy="184" r="10" fill="#C026D3"/>
    <circle cx="211" cy="145" r="13" fill="#A78BFA"/>
  </g>
  <circle cx="211" cy="145" r="22" fill="none" stroke="#C4B5FD" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Wordmark -->
  <text x="330" y="143" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="750" letter-spacing="-2">
    <tspan>Le</tspan><tspan fill="#A78BFA">Xplai</tspan><tspan>Net</tspan>
  </text>
  <text x="334" y="188" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="450" letter-spacing="0.4">
    Layer-wise Relevance Propagation for PyTorch
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">
    <rect x="334" y="220" width="118" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.65"/>
    <text x="356" y="244" fill="#DDD6FE">IMPLICIT</text>
    <rect x="468" y="220" width="112" height="36" rx="18" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="489" y="244" fill="#BAE6FD">EXPLICIT</text>
  </g>
</svg>
